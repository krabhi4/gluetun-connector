[package]
name = "gluetun-connector"
version = "1.0.0"
edition = "2021"
description = "Web UI and Monitor for Gluetun VPN container management"
license = "MIT"

[[bin]]
name = "gluetun-connector"
path = "src/main.rs"

[dependencies]
axum            = { version = "0.8.9", features = ["macros"] }
tokio           = { version = "1.54.1", features = ["full"] }
tokio-util      = { version = "0.7.20", features = ["rt"] }
tower           = "0.5.3"
tower-http      = { version = "0.7.1", features = ["fs", "set-header"] }
governor        = "0.10.4"

reqwest         = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
bollard         = { version = "0.21.1", default-features = false, features = ["http", "pipe"] }
futures-util    = "0.3.34"

serde           = { version = "1.0.229", features = ["derive"] }
serde_json      = "1.0.154"
url             = "2.5.8"
base64          = "0.23.1"
tracing         = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
anyhow             = "1.0.104"
chrono             = { version = "0.4.45", features = ["serde"] }

[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
strip         = true
panic         = "abort"
